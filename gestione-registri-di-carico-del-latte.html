<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GL0501 - Gestione Registri di Carico</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            color: #000000;
            margin: 20px;
        }

        .window-container {
            width: 900px;
            background-color: #ffffff; /* Sfondo bianco */
            border: 2px solid #a0a0a0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .window-header {
            color: #404040;
            padding: 5px 10px;
            font-size: 12px;
            font-family: Arial, sans-serif;
            font-weight: normal;
        }

        .window-content {
            padding: 25px;
        }

        /* Titolo Principale della Scheda */
        .main-title {
            font-family: Arial, sans-serif;
            font-size: 22px;
            color: #0284c7;
            margin-bottom: 25px;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 5px;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .label-col {
            width: 320px;
        }

        .dots-col {
            width: 30px;
            text-align: left;
        }

        input[type="text"] {
            background-color: #ffffff;
            border: 1px solid #b0b0b0;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            padding: 3px 5px;
            color: #000000;
        }

        input.center {
            text-align: center;
        }

        .separator {
            border-top: 1px solid #c0c0c0;
            margin: 20px 0;
        }

        /* Stile per la descrizione a doppia riga */
        .description-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Barra dei comandi inferiore azzurra */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            font-size: 16px;
        }

        .btn-blue {
            background-color: #0284c7;
            color: #ffffff;
            padding: 2px 8px;
        }

        .help-box {
            background-color: #0284c7;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 0 6px;
            font-size: 14px;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="window-container">
    <div class="window-header">GL0501</div>

    <div class="window-content">
        
        <div class="main-title">Gestione Registri di Carico</div>
        
        <div class="row">
            <div class="label-col">Codice Registro Giro Camion</div>
            <div class="dots-col">:</div>
            <div><input type="text" value="R01" class="center" style="width: 45px;"></div>
        </div>

        <div class="separator"></div>

        <div class="row" style="align-items: flex-start; margin-top: 35px;">
            <div class="label-col" style="margin-top: 5px;">Descrizione</div>
            <div class="dots-col" style="margin-top: 5px;">:</div>
            <div class="description-container">
                <input type="text" value="REGISTRO TRASPORTATORE GIRO MONTAGNA" style="width: 500px;">
                <input type="text" value="" style="width: 500px; height: 20px;">
            </div>
        </div>

        <div class="row" style="margin-top: 40px;">
            <div class="label-col">Codice agente</div>
            <div class="dots-col">:</div>
            <div style="display: flex; align-items: center; gap: 120px;">
                <input type="text" value="777" class="center" style="width: 50px;">
                <span>TV OCRES</span>
            </div>
        </div>

        <div class="row" style="margin-top: 40px; margin-bottom: 35px;">
            <div class="label-col">Codice articolo</div>
            <div class="dots-col">:</div>
            <div><input type="text" value="900035" style="width: 150px;"></div>
        </div>

        <div class="separator"></div>

        <div class="row" style="margin-top: 35px;">
            <div class="label-col">Rinumerazione posizioni registro</div>
            <div class="dots-col">:</div>
            <div><input type="text" value="N" class="center" style="width: 20px;"></div>
        </div>

        <div class="footer-bar">
            <div class="btn-blue">F1 -> Ritorno a menu'</div>
            <div style="display: flex; align-items: center;">
                <span class="btn-blue">Conferma (S/N/R) :</span>
                <span class="help-box">?</span>
            </div>
        </div>

    </div>
</div>

</body>
</html>
