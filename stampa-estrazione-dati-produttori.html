<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GL0401 - Stampa Dati Produttori</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            color: #000000;
            margin: 20px;
        }

        .window-container {
            width: 900px;
            background-color: #ffffff; /* Sfondo bianco richiesto */
            border: 2px solid #a0a0a0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .window-header {
            color: #404040;
            padding: 5px 10px;
            font-size: 12px;
            font-family: Arial, sans-serif;
            font-weight: normal;
        }

        .window-content {
            padding: 20px;
        }

        /* Titolo Principale della Scheda */
        .main-title {
            font-family: Arial, sans-serif;
            font-size: 22px;
            color: #0284c7;
            margin-bottom: 25px;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 5px;
        }

        /* Intestazioni Azzurre */
        .blue-header {
            background-color: #0284c7;
            color: #ffffff;
            padding: 2px 6px;
            display: inline-block;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .flex-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        /* Allineamento colonne per la griglia principale */
        .col-label { width: 220px; }
        .col-da    { width: 220px; }
        .col-a-lbl { width: 40px; text-align: center; }
        .col-a     { width: 200px; }
        .col-ord   { width: 40px; text-align: center; }
        .col-spag  { width: 60px; text-align: center; }
        .col-stot  { width: 40px; text-align: center; }

        input[type="text"] {
            background-color: #ffffff;
            border: 1px solid #b0b0b0;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            padding: 2px 4px;
            color: #000000;
        }

        input.center { text-align: center; }

        .separator-box {
            border: 1px solid #c0c0c0;
            margin: 25px 0 20px 0;
            height: 70px; /* Rettangolo vuoto centrale */
            width: 70%;
            margin-left: auto;
            margin-right: auto;
        }

        /* Barra dei comandi inferiore */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            font-size: 16px;
        }

        .btn-blue {
            background-color: #0284c7;
            color: #ffffff;
            padding: 2px 8px;
        }

        .blue-block {
            background-color: #0284c7;
            width: 330px;
            height: 22px;
        }
    </style>
</head>
<body>

<div class="window-container">
    <div class="window-header">GL0401</div>

    <div class="window-content">
        
        <div class="main-title">Stampa Dati Produttori</div>
        
        <div class="flex-row" style="margin-bottom: 25px;">
            <div class="blue-header">Selezioni</div>
            <div style="margin-left: auto;" class="blue-header">Ordine S.Pag. S.Tot.</div>
        </div>

        <div class="flex-row">
            <div class="col-label">Cod.Regione da:</div>
            <div class="col-da"><input type="text" style="width: 50px;"></div>
            <div class="col-a-lbl">a:</div>
            <div class="col-a"><input type="text" value="zzzz" style="width: 60px;"></div>
            <div class="col-ord"><input type="text" value="1" class="center" style="width: 20px;"></div>
            <div class="col-spag"><input type="text" value="N" class="center" style="width: 20px;"></div>
            <div class="col-stot"><input type="text" value="N" class="center" style="width: 20px;"></div>
        </div>

        <div class="flex-row">
            <div class="col-label">Cod.Provincia da:</div>
            <div class="col-da"><input type="text" style="width: 50px;"></div>
            <div class="col-a-lbl">a:</div>
            <div class="col-a"><input type="text" value="zzzz" style="width: 60px;"></div>
            <div class="col-ord"><input type="text" value="0" class="center" style="width: 20px;"></div>
            <div class="col-spag"><input type="text" value="N" class="center" style="width: 20px;"></div>
            <div class="col-stot"><input type="text" value="N" class="center" style="width: 20px;"></div>
        </div>

        <div class="flex-row">
            <div class="col-label">Cod.Associaz. da:</div>
            <div class="col-da"><input type="text" style="width: 50px;"></div>
            <div class="col-a-lbl">a:</div>
            <div class="col-a"><input type="text" value="zzzz" style="width: 60px;"></div>
            <div class="col-ord"><input type="text" value="2" class="center" style="width: 20px;"></div>
            <div class="col-spag"><input type="text" value="N" class="center" style="width: 20px;"></div>
            <div class="col-stot"><input type="text" value="N" class="center" style="width: 20px;"></div>
        </div>

        <div class="flex-row">
            <div class="col-label">Produttore da:</div>
            <div class="col-da"><input type="text" style="width: 65px;"></div>
            <div class="col-a-lbl">a:</div>
            <div class="col-a"><input type="text" value="zzzzz" style="width: 75px;"></div>
            <div class="col-ord"><input type="text" value="3" class="center" style="width: 20px;"></div>
            <div class="col-spag"><input type="text" value="N" class="center" style="width: 20px;"></div>
            <div class="col-stot"><input type="text" value="N" class="center" style="width: 20px;"></div>
        </div>

        <div class="flex-row">
            <div class="col-label">Fornitore da:</div>
            <div class="col-da"><input type="text" style="width: 110px;"></div>
            <div class="col-a-lbl">a:</div>
            <div class="col-a"><input type="text" value="zzzzzzzzz" style="width: 120px;"></div>
            <div class="col-ord"><input type="text" value="0" class="center" style="width: 20px;"></div>
            <div class="col-spag"><input type="text" value="N" class="center" style="width: 20px;"></div>
            <div class="col-stot"><input type="text" value="N" class="center" style="width: 20px;"></div>
        </div>

        <div class="flex-row">
            <div class="col-label">Cod.articolo da:</div>
            <div class="col-da"><input type="text" style="width: 180px;"></div>
            <div class="col-a-lbl">a:</div>
            <div class="col-a"><input type="text" value="zzzzzzzzzzzzzzz" style="width: 190px;"></div>
            <div class="col-ord"><input type="text" value="0" class="center" style="width: 20px;"></div>
            <div class="col-spag"><input type="text" value="N" class="center" style="width: 20px;"></div>
            <div class="col-stot"><input type="text" value="N" class="center" style="width: 20px;"></div>
        </div>

        <div class="separator-box"></div>

        <div class="footer-bar">
            <div class="btn-blue">F1 -> Menu'</div>
            <div class="blue-block"></div>
            <div>
                <span class="btn-blue">Conferma (S/N):</span>
                <input type="text" style="width: 20px; margin-left: 5px; background-color: #0284c7; color: #ffffff; border: none; text-align: center;">
            </div>
        </div>

    </div>
</div>

</body>
</html>
